name: TECHNO Production Login Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout TECHNO
        uses: actions/checkout@v4

      - name: Verify login preflight and CORS
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS 'https://techno-lims-api.onrender.com/api/auth/login' \
            -H 'Origin: https://osamababeker4-netizen.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://osamababeker4-netizen.github.io' "$headers"

      - name: Verify password-login route is reachable
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' -X POST 'https://techno-lims-api.onrender.com/api/auth/login' \
            -H 'Origin: https://osamababeker4-netizen.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"username":"__production_login_probe__","password":"__invalid_probe__"}')
          test "$code" = '401'
          grep -qi '^access-control-allow-origin: https://osamababeker4-netizen.github.io' "$headers"
          grep -q 'invalid_credentials' "$body"

      - name: Verify production health version and Pages release
        run: python3 production_smoke.py
